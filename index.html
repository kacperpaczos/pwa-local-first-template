<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A local-first PWA template: offline-capable notes with SQLite/OPFS storage, an outbox for offline writes, and encrypted peer sync — no backend server owns your data."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="pwa-local-first-template" />
    <meta
      property="og:description"
      content="Offline-capable, multi-device local-first PWA template built with Solid.js, SQLite/OPFS, and encrypted peer sync."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="pwa-local-first-template" />
    <meta
      name="twitter:description"
      content="Offline-capable, multi-device local-first PWA template built with Solid.js, SQLite/OPFS, and encrypted peer sync."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>pwa-local-first-template</title>
    <script>
      (function () {
        try {
          var key = "pwa-ui-theme";
          var stored = localStorage.getItem(key);
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          var mode = stored === "light" || stored === "dark" ? stored : system;
          if (!stored) localStorage.setItem(key, "system");
          document.documentElement.dataset.kbTheme = mode;
          document.documentElement.style.colorScheme = mode;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", mode === "dark" ? "#0f1419" : "#f4f7fb");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <noscript>JavaScript is required to run this app.</noscript>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
