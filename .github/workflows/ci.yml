name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly canary against dependency drift (several deps are pre-1.0).
    - cron: "17 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint + format (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # All four layers (unit, contract, integration, dom) — see "Test layers"
      # in docs/architecture.md. Node 24 is required: the contract layer runs
      # the shipping persistence over node:sqlite, unflagged only from 23.4.
      - name: Unit, contract, integration + component tests with coverage
        run: pnpm vitest run --coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const s=require('./coverage/coverage-summary.json').total; console.log('lines ' + s.lines.pct + '% | branches ' + s.branches.pct + '% | functions ' + s.functions.pct + '%')" >> "$GITHUB_STEP_SUMMARY"
          fi

      # This is a clean production build (no VITE_E2E) — the e2e job's build
      # bakes VITE_E2E=1, so it cannot be reused for this guard.
      - name: Production build must not ship e2e-only identity hooks
        run: pnpm build && pnpm check:no-e2e-hooks

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E (Chromium)
        run: pnpm test:e2e
