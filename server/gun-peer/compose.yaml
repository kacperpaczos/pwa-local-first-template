services:
  gun-peer:
    build:
      context: .
    ports:
      - "8765:8765"
    environment:
      GUN_PEER_HOST: "0.0.0.0"
      GUN_PEER_PORT: "8765"
    volumes:
      - gun-data:/app/.gun-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional TLS front-door. Uncomment and point Caddyfile / domains as needed.
  # caddy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   depends_on:
  #     gun-peer:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  gun-data:
  # caddy-data:
